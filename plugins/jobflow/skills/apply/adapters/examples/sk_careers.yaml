# verified: 2026-10 기준 1인 실측, 사이트 개편 시 달라질 수 있음
# 회사 전용 예시: 다른 회사 지원서를 만들 때 어댑터를 어떻게 쓰는지 보여 주는 참고용이다
# SK Careers (skcareers.com) - SK그룹 통합 채용
# 확인 사례: 그룹 계열사 기술사무직 신입 공고
# status: verified - 로그인 후 폼 구조까지 실측.
id: sk_careers
status: verified
verified_at: "2026-08"

match:
  - "www.skcareers.com/*"
  - "<계열사 채용 안내 도메인>"  # 공고 안내용. 실제 지원은 skcareers 로 넘어간다.

auth:
  type: account
  scope: group                  # SK그룹 계열사 통합 계정
  mfa: email                    # ✅ 이메일 인증코드. PASS/아이핀/휴대폰 본인인증 위젯 없음.
  captcha:
    on_login: false             # ✅ 로그인 화면에 캡차 없음
  social_login: [naver, kakao]  # OAuth - 자동화 난이도 높으므로 이메일+비밀번호 경로를 쓸 것
  login:
    url: "https://www.skcareers.com/User/Login"
    fields:
      - { key: email,    selector: "#Email",  type: email }
      - { key: password, selector: "#PCode",  type: password }
    remember: "#RememberMe"
  signup:
    url: "https://www.skcareers.com/User/Join"
    fields: [Email, AuthNumber, Name, PhoneNumber, Birth, Gender, Password, PasswordConfirm]
    consents: [IsAgreePersonal1, IsAgreeSensitive, IsAgreePersonal2, IsAgreeConsign]
    verify: "Email 입력 → 인증코드 발송 → AuthNumber 에 입력"
    warning: "사이트 안내에 '기존 회원도 신규 가입이 필요합니다' - 과거 계정이 있어도 재가입해야 할 수 있다."

url_shape:
  job_detail: "https://www.skcareers.com/Recruit/Detail/{recruit_id}"
  apply_gate: "https://www.skcareers.com/User/Login?returnUrl=%2FRecruit%2FDetail%2F{recruit_id}"

# 로그인 없이 얻을 수 있는 사전 정보
public_assets:
  - name: "지원서 입력 가이드.pdf"
    note: "공고 상세의 첨부파일. 로그인 없이 받을 수 있고 폼 구조가 문서화돼 있다. 폼 매핑을 미리 짤 때 쓸 것."
  - name: "Job Description.pdf (국문/영문)"
    note: "직무별 근무지역이 여기 있다. 지원서에서 근무지 우선순위를 고르라고 요구한다."

# ─────────────────────────────────────────────────────────────
# 2026-08 로그인 후 실측
# ─────────────────────────────────────────────────────────────
runtime:
  form_url: "https://www.skcareers.com/Application/Index/{recruit_id}"
  single_page: true          # 단계 분할 없이 한 페이지에 전 섹션
  field_count: 320
  save:
    draft_button: "임시 저장"   # ✅ 지원
    submit_button: "최종 제출"  # 🚫 절대 누르지 않는다
  sections: [인적 사항, 지원 정보, 학력, 경력, 경험/특허, 수상, 자격/면허, 어학, 경험기술서, 추가자료, 동의 사항]
  prefilled_from_account: [성명, 이메일, 휴대폰(인증완료), 생년월일, 성별]
  photo: { ratio: "3:4", max_size: "5MB", formats: [png, jpeg, jpg], recommended: "124x160px" }

  field_prefixes:
    prs: 인적/신상 (이름·연락처·사진·국적·주소·보훈·병역·장애)
    app: 지원정보 (appJobRoleLevel1/2 1~2지망, appWorkingRegion/Area, appApplyPath)
    edu: 학사 (eduMajorDoubleYN/eduMajorDouble 로 복수전공 입력 가능)
    eduhg: 고등학교
    edugd: 대학원 (논문·학회·지도교수·연구실)
    car: "경력 / expr 경험·특허 / awd 수상 / cer 자격증 / lng 어학"
    expdoc: 경험기술서 (expdocAnsDesc_20, expdocAnsDesc_30 - textarea 2개)

  # 자소서가 아니라 '경험기술서' 형식이다
  essay_style: 경험기술서

# 정정 기록: 고등학교 학력은 필수가 아니었다
resolved_gaps:
  - id: high_school_transcript
    was: |
      폼에 고교 학년별 교과 성적(highSchoolYear/Term/Subject/Unit/Rank)과
      결석·지각·조퇴(질병/무단/기타) 입력란이 있어 '차단 gap' 으로 판정했었다.
    correction: |
      '지원서 입력 가이드.pdf' 1페이지 요지(학력 입력은 선택 사항이며 최종 학력이 학/석/박사면 고등학교 학력은 기입하지 않아도 무방):
      → 최종학력이 학사이므로 고등학교 학력을 통째로 비워도 된다. 차단 아님.
    lesson: "폼에 입력란이 있다고 필수인 게 아니다. 공고 첨부 가이드 문서를 먼저 읽을 것."

input_rules:   # 가이드 PDF 에서 확인
  최종학력_표기: "졸업 시점이 공고 기준일 이전이면 '졸업', 이후면 '졸업예정'. 공고 가이드의 기준을 따른다"
  평균학점: "성적증명서 상 총 평점평균"
  총이수학점: "성적증명서 상 총 취득학점"
  학년별_전공: "전공 과목만, '과목명(점수)' 형식. 복수/부전공 및 전공기초 포함, 교양·일반선택 제외"
  학년별_전공_평균: "전공 과목만의 평균 → 상단 평균학점과 달라도 정상"
  경력: "국민연금 가입증명서 상 최근 5개만"
  자격증: "직무 무관해도 기입 무방하나 유관 위주 권장"

experience_doc:
  name: "경험기술서 (AI 활용 문제 해결 경험을 묻는 문항)"
  field: expdocAnsDesc_*
  limit: 2000
  required: true
  format: "정해진 양식 없음. 경험/기간/역할 구성을 권장"
  note: "문항 원문은 공고마다 다르다. 소재는 경험 카드에서 제시하고 문장은 사람이 쓴다"

process_facts:             # 일정은 공고마다 다르다. 구조적 사실만 남긴다
  deadline_note: "마감 시각이 정각이 아닌 경우가 있다(예: 16:59). 공고 원문 확인"
  duplicate: "계열사 간 중복 지원 불가"
  withdraw_and_resubmit: "최종 제출 후에도 마감 전이면 지원 철회 -> 수정 -> 재제출 가능 (실측)"

# ─────────────────────────────────────────────────────────────
# 🚨 필드 함정 (실제 오입력 발생 직전 사례)
# ─────────────────────────────────────────────────────────────
field_traps:
  - id: education_type_vs_latest
    severity: critical
    desc: |
      학력 섹션에 이름이 비슷한 select 가 둘 있다. 하나만 설정하면 나머지는 기본값이 남는다.
        · eduLastestEducationType  = "최종 학력"  (고등학교/전문대학/대학(학사)/대학원…)
        · eduEducationType         = "학업 과정"  (전문대학(전문학사) / 대학(학사))  ← 기본값이 **전문대학**
      실측에서 최종학력만 '대학(학사)' 로 넣고 학업과정을 방치해
      **전문대학(전문학사)로 제출될 뻔했다.** 사용자가 육안으로 발견했다.
    action: |
      학력 입력 후 반드시 두 필드를 각각 읽어 확인한다.
      eduEducationType 의 '대학(학사)' value 는 308003 (전문대학은 308002).
  - id: silent_defaults
    severity: high
    desc: |
      이 폼은 select 상당수가 **빈 값이 아니라 첫 옵션이 선택된 상태**로 시작한다.
      "미입력이면 비어 있을 것"이라는 가정이 통하지 않는다.
    action: |
      ③fill 이후 검증 단계에서 '내가 설정한 필드' 가 아니라
      **'제출될 모든 필수 필드'** 를 훑어 값을 읽고 사람에게 보고한다.
