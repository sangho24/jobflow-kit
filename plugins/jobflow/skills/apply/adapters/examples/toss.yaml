# verified: 2026-10 기준 1인 실측, 사이트 개편 시 달라질 수 있음
# 회사 전용 예시: 다른 회사 지원서를 만들 때 어댑터를 어떻게 쓰는지 보여 주는 참고용이다
# toss.im/career (비바리퍼블리카 자체 폼, 백엔드는 Greenhouse) 어댑터
# 관측: 데이터·AI 직무 공고 - 2026-10 실측
ats: toss
status: verified
domains:
  - toss.im/career
seen_in:
  - 핀테크 대기업 (자체 폼 + Greenhouse 백엔드)

policy:
  duplicate_apply: true    # 계열사 간·포지션 간 중복지원 허용. 동일 포지션만 탈락 후 6개월 락

login:
  note: 계정·로그인 없이 바로 작성. 본인인증·캡차 없음

flow:
  - 공고 상세(job-detail?gh_jid=<id>) '지원하기' → /career/apply/basic/<id>
  - 한 페이지 단일 폼. 하단 '제출하기' 버튼 하나뿐
  - greenhouse.yaml 의 Job Board API 는 쓸 수 없다. 보드 이름(toss, vivarepublica 등)이 전부 404

save:
  draft: false             # 🚨 임시저장 없음. 탭을 벗어나면 입력 소실. 두 건이면 탭을 나눈다
  submit_button_text: 제출하기   # 🚫 누르지 않는다. 필수칸이 차기 전에는 disabled

fields:
  # 포지션마다 문항 구성이 조금 다르다. DIP 에는 '기타 서류'·'링크'가 있고 Commerce 에는 없었다
  name: { type: 자유입력, note: "성·이름 칸 분리. placeholder '성' / '이름'" }
  email: { selector: 'input[name="fields.email"]', type: 자유입력, note: "role=combobox 지만 도메인 제안용이라 그냥 입력해도 값이 잡힌다" }
  phone: { selector: 'input[name="fields.phone"]', type: 자유입력, note: "010-0000-0000 하이픈 형식 그대로 통과" }
  resume: { name: fields.resume, type: 파일, note: "이력서+경력기술서 한 파일로 통합. 최대 50MB" }
  portfolio: { name: fields.cover_letter, type: 파일, required: false }
  career_type: { type: 라디오, note: "'경력'이 기본 선택돼 있다. 신입이면 반드시 바꿀 것" }
  career_years: { type: 자유입력, note: "정수만. 0.6 입력 시 '경력 기간은 연 단위로 입력해주세요.' 0 은 허용" }
  company: { type: 검색형(결과 내장), note: "회사명 입력 시 사업자번호·주소가 붙은 option 이 뜬다. 같은 이름이 여럿이면 사업자번호로 구분해 클릭" }
  job_title: { type: 자유입력, placeholder: "(예시) Frontend Developer" }
  period: { type: 날짜 세그먼트, note: "spinbutton 년·월·일. fill/pressSequentially 는 안 먹는다. 세그먼트 클릭 후 keyboard.press 로 한 자리씩 입력하면 자동으로 다음 칸 이동. '재직 중'을 체크하면 필드가 다시 그려져 값이 지워지므로 체크를 먼저 하고 날짜를 넣는다. 숨은 input(placeholder 년.월.일)에 YYYY-MM-DD 형식으로 잡히는지 확인" }
  route: { type: 커스텀 드롭다운, note: "combobox 클릭 → visible option 클릭. 숨은 native select 는 첫 옵션 값이 미리 들어가 있으니 selectedIndex 로 검증" }
  link: { type: 자유입력, placeholder: "https://", required: false }
  consents:
    personal-agree: 필수
    personal-optional-agree: "선택. 병역·기타서류 같은 선택 정보를 내려면 필요"
    sensitive-info-agree: "선택. 장애·보훈 증빙을 낼 때만"
    prospect-agree: "선택. 다른 포지션 제안 수신"
    career-agree: "선택. 공개채용 안내 수신"

automation_limits:
  file_upload: "playwright-chrome(--extension) 연결에서는 DOM.setFileInputFiles 가 'Not allowed' 로 막힌다. 파일 첨부는 사람이 한다"
