# verified: 2026-09 기준 1인 실측, 사이트 개편 시 달라질 수 있음
# careerlink (inhr / NHR) 어댑터
# 관측: 금융권 신입 공채 (<회사>.careerlink.kr) - 2026-09
ats: careerlink
status: verified
domains:
  - "*.careerlink.kr"
  - img.inhr.co.kr
seen_in:
  - 금융권 다수 (회사별 서브도메인)

login:
  url: /login
  fields:
    email: 'input[name="id"]'
    password: 'input[name="pwd"]'
  submit_text: 로그인
  note: 이메일+비밀번호. 별도 본인인증 없음
  account_scope: per_company   # 실측: 계정은 회사(서브도메인)별로 분리된다.
                               # A사 계정으로 B사 로그인을 시도하면
                               # "아이디 또는 비밀번호를 확인해 주세요." 로 거부된다.
                               # 자격증명 서비스명도 <prefix>-careerlink 하나로 쓰지 말고
                               # <prefix>-careerlink-<회사> 로 나눌 것.
                               # 새 careerlink 공고는 회원가입부터 필요 -> 자동 가입 금지, 사람이 만든다

save:
  draft: true              # 임시저장 있음. 마감 전까지 계속 수정 가능
  draft_button_text: 임시저장
  submit_button_text: 최종제출   # 🚫 누르지 않는다
  session_timeout_min: 30       # '로그인 연장' 버튼으로 갱신

# ─────────────────────────────────────────────
# 폼 구조 - MUI 기반 SPA. 하드코딩 셀렉터가 통하지 않는다
# ─────────────────────────────────────────────
quirks:
  - id: mui_useid_unstable
    what: "input id 가 `:r8:` `:rf:` 형태(MUI useId)라 리렌더마다 바뀐다"
    how: "라벨 텍스트로 data-* 속성을 붙여 안정 셀렉터를 만든 뒤 조작한다"

  - id: select_needs_real_mouse
    what: "MUI Select 는 mousedown 으로 열린다. DOM 의 element.click() 으로는 열리지 않는다"
    how: "page.click() 을 먼저 시도하고, 가려져서 실패할 때만 evaluate 클릭으로 폴백"

  - id: select_id_is_korean_label
    what: "MUI Select 는 `#select-군별` `#select-졸업 구분` 처럼 id 에 한글 라벨(공백 포함)이 들어간다"
    how: "공백이 있으면 `[id=\"select-졸업 구분\"]` 속성 셀렉터를 쓴다"

  - id: escape_closes_modal
    what: "학력·경력은 모달로 입력한다. 팝업이 없을 때 Escape 를 누르면 모달 자체가 닫혀 입력이 날아간다"
    how: "열린 [role=option] 이 있을 때만 Escape 를 누른다"

  - id: hidden_modals_share_button_text
    what: "닫힌 모달의 '저장하기'·'삭제하기' 버튼이 DOM 에 남아 있어 잘못 눌린다"
    how: "보이는 [role=dialog] 중 마지막 것 안에서만 버튼을 찾는다"

  - id: date_format_slash
    what: "날짜는 `YYYY/MM/DD` 문자열. 다른 형식을 넣으면 조용히 '오늘'로 덮어쓴다"
    how: "네이티브 setter + input/change 이벤트로 `2021/11/15` 형태를 넣고 값 재확인"

  - id: edit_modal_may_open_empty
    what: "저장된 카드의 편집(연필) 모달이 값을 비운 채 열릴 때가 있다. 그대로 저장하면 항목이 중복 생성된다"
    how: "저장 후 카드 개수를 세고, 중복이면 편집 모달의 '삭제하기' → '예' 로 지운다"

  - id: empty_card_side_effect
    what: "모달을 잘못 저장하면 빈 학력/자격 카드가 생기고 임시저장은 통과한다"
    how: "임시저장 후 전체 캡처로 빈 카드(학점 0.00, 발행처 공란)를 반드시 확인"

  - id: autocomplete_filter_accumulates
    what: "검색형 Autocomplete 에 필터를 두 번 치면 '대한대한'이 되어 결과가 0"
    how: "필터 입력 전에 필드를 비운다"

field_hints:
  # 기본인적사항
  한글 성명: 'input[name="APLT_NM"]'      # 회원정보에서 자동 채움
  영문 성: 'input[name="aplt_sur_enm"]'
  영문 이름: 'input[name="APLT_ENM"]'
  국적: combobox
  우편번호: 'input[name="zip_no"]'         # 직접 입력 가능 ('찾기' 팝업 불필요)
  주소: 'input[name="adr"]'
  상세주소: 'input[name="adr_ptc"]'
  휴대폰: 'input[name="HP_NO"]'
  비상연락처_국가번호: combobox
  비상연락처: 'input[name="emgy_hp_no"]'
  이메일: 'input[name="EMAIL_GBCD"]'
  성별: 토글버튼(남/여)
  병역: 토글버튼(해당없음/군필/미필/면제/전역 예정)
  군별: '#select-군별'
  계급: '#select-계급'
  병과: combobox                          # 병과 코드 목록에서 선택
  전역사유: '#select-전역사유'

  # 학력 - 섹션 헤더 오른쪽 + 버튼으로 모달을 연다
  고등학교: [학교명(검색), 학교소재지(자동), 졸업구분, 재학기간]
  대학교: [신규입학/편입(토글·필수), 국내/국외(토글·필수), 학교명(검색), 본/분교(자동), 학교소재지(자동), 주전공(검색), 부전공/복수전공/해당없음(토글), 복수·부전공(검색), 기준학점(자동), 학점, 졸업구분, 재학기간]
  note_대학교: "학교를 고르면 본/분교·소재지·기준학점이 자동 설정된다. 기준학점(4.3/4.5 등)은 학교마다 다르니 자동값을 확인하고 프로필 만점 기준과 맞춘다"

  # 자격 - 공고별 우대 자격증만 드롭다운에 뜬다. 그 외는 입력 불가
  자격증명: '#select-자격증명'
  note_자격: "부문별로 목록에 없는 자격증이 있다(목록에 없으면 입력 불가). 증빙서류 업로드 필수"

  # 경력
  회사명: combobox(기업DB 검색)
  고용형태: '#select-고용형태'
  재직 여부: '[id="select-재직 여부"]'
  note_경력: "재직 중이어도 근무기간 종료일을 비우면 임시저장이 '[경력사항]의 종료일자를 확인해주세요' 로 거부된다. 지원일자를 넣는다"

  # 자소서
  자소서: 'textarea[name^="SINT_INFOSTMT"]'   # 문항 수만큼 반복, maxlength=800

photo:
  input: 'input[type="file"][name="PHOTO"]'
  accept: .JPG,.PNG
  max: 5MB
